name: Daily Outreach Generator

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  DAILY_LIMIT: "60"
  TARGET_MARKETS: "مصر,السعودية,الإمارات,الكويت,قطر,البحرين,عمان"
  GEMINI_MODEL: "gemini-2.5-flash"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Discover brands and generate outreach
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python outreach_generator.py

      - name: Commit results and discovery history
        run: |
          git config user.name "outreach-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/results.json data/brand_history.csv
          git commit -m "اكتشاف وتحديث رسائل $(date +%F)" || echo "لا يوجد تغيير"
          git push
